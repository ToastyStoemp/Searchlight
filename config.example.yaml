# Copy this file to config.yaml and fill in your own items.

# The things that were stolen. A listing counts as a match when every word of
# at least one `keywords` phrase appears in it. Be specific (model numbers,
# colours, sizes) to cut noise, and use `exclude` for common false positives.
products:
  - name: Laptop (MacBook Pro 14" M3, space black)
    keywords:
      - macbook pro 14 m3
      - macbook pro m3 space black
      - mbp 14 m3
    queries:            # what is typed into each site's search box
      - macbook pro m3
      - macbook pro 14
    exclude: [hülle, case, sleeve, ladegerät, charger, defekt gesucht, suche]
    min_price: 300      # ignore accessories and "wanted" ads

  - name: Camera (Sony A7 IV + 24-70)
    keywords:
      - sony a7 iv
      - sony a7iv
      - sony alpha 7 iv
      - ilce 7m4
    queries:
      - sony a7 iv
      - a7iv
    exclude: [akku, battery, cage, gesucht]
    min_price: 400

# Sites to check. Built in: ricardo, tutti, anibis, facebook.
enabled_sources: [ricardo, tutti, anibis, facebook]

# Facebook Marketplace city slug, as in facebook.com/marketplace/<slug>/
facebook_location: zurich

interval_minutes: 90        # how often to check (each run is randomised ±20%)
active_hours: [7, 23]       # only search between 07:00 and 23:00
search_delay_seconds: [20, 75]  # random pause between two searches
headless: auto              # auto = no window on a server, visible on a desktop
captcha_wait_minutes: 10    # with a visible window: time you get to solve a captcha
block_cooldown_hours: 2     # a site that blocks is skipped 2 h, then 4 h, 8 h... (max 24 h)
backup_matches: true        # save a full offline copy of every matching listing
data_dir: ~/.searchlight    # database, backups, report, login session
                            # (in Docker use: data_dir: /data)

notify:
  # Easiest: install the free "ntfy" app on your phone and subscribe to a
  # long, hard-to-guess topic name. Anyone who knows the name can read it.
  ntfy:
    topic: searchlight-change-me-7f3k2q
    # server: https://ntfy.sh
